[project]
name = "fpl-analyzer"
version = "0.1.0"
description = "Leo the PL Lion - Agentic FPL Analysis Assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.38.0",
    "requests>=2.31.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "google-genai>=0.1.0",
    "pandas>=2.0.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
