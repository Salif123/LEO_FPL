[project]
name = "fpl-analyzer"
version = "1.0.0"
description = "FPL & Football Underlying Statistics API Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "pytest>=8.0.0",
    "langgraph>=1.2.12",
    "langchain-core>=1.6.5",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
